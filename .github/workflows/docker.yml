name: Docker image

# Builds the image natively on amd64 and arm64 runners, runs the smoke tests
# on both, and (only on main) pushes one multi-platform image to Docker Hub
# as :latest and :YYYYMMDD, and syncs README.md to the Docker Hub page. The
# Tools section of README.md is generated with `make readme`; pull requests
# fail if it doesn't match the image.
#
# Requires the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (a Docker Hub personal access token with Read, Write, Delete scope; Delete
# is needed for updating the repository description).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: datasciencetoolbox/dsatcl2e

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - name: Prepare
        run: echo "ARCH=${PLATFORM#linux/}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: ${{ env.IMAGE }}:test
          cache-from: type=gha,scope=${{ env.ARCH }}
          cache-to: type=gha,mode=max,scope=${{ env.ARCH }}

      - name: Smoke test
        run: docker run --rm -v "$PWD/tests":/tests "$IMAGE:test" /tests/smoke.sh

      - name: Check that README.md lists the versions in the image
        if: github.event_name == 'pull_request' && matrix.platform == 'linux/amd64'
        run: |
          scripts/update-readme.sh "$IMAGE:test"
          if ! git diff --exit-code README.md; then
            echo "::error file=README.md::The Tools section doesn't match the image. Run \`make readme\` and commit README.md."
            exit 1
          fi

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push by digest
        if: env.PUSH == 'true'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.ARCH }}

      - name: Export digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - name: Upload digest
        if: env.PUSH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ env.ARCH }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-platform image
        working-directory: /tmp/digests
        run: |
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:$(date -u +%Y%m%d)" \
            "${sources[@]}"

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:latest"

      - uses: actions/checkout@v7

      - name: List the versions in the published image in README.md
        run: scripts/update-readme.sh "$IMAGE:latest"

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: Every command-line tool from Data Science at the Command Line, ready to use
          readme-filepath: ./README.md
          enable-url-completion: true
